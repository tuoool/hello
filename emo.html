<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <title>Trova l’Emoji</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      background: #09111f;
      color: white;
      overscroll-behavior: none;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(circle at top, #25395e, transparent 55%),
        #09111f;
    }

    #canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .hidden {
      display: none !important;
    }

    .hud {
      position: absolute;
      z-index: 10;
      top: max(12px, env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      pointer-events: none;
    }

    .hud-box,
    .toolbar,
    .panel {
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.13);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(15px);
    }

    .hud-box {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      padding: 9px 12px;
      border-radius: 20px;
      pointer-events: auto;
    }

    #targetPreview {
      display: grid;
      place-items: center;
      width: 50px;
      height: 50px;
      flex: 0 0 50px;
      border-radius: 15px;
      background: rgba(139, 92, 246, 0.2);
      font-size: 31px;
    }

    .hud-copy {
      min-width: 0;
    }

    .hud-copy small {
      display: block;
      color: #aeb9ce;
    }

    #gameStats {
      margin-top: 3px;
      font-weight: 800;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      gap: 5px;
      padding: 6px;
      border-radius: 19px;
      pointer-events: auto;
    }

    .icon-button {
      width: 43px;
      height: 43px;
      border: 0;
      border-radius: 13px;
      background: #26334a;
      color: white;
      font-size: 20px;
      font-weight: 900;
    }

    .overlay {
      position: absolute;
      z-index: 30;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(3, 7, 18, 0.76);
      backdrop-filter: blur(8px);
    }

    .panel {
      width: min(100%, 520px);
      max-height: calc(100dvh - 32px);
      overflow: auto;
      padding: 21px;
      border-radius: 28px;
    }

    h1,
    h2 {
      margin: 0;
    }

    .description {
      margin: 7px 0 20px;
      color: #aeb9ce;
    }

    .status {
      margin-bottom: 17px;
      padding: 11px 13px;
      border-radius: 14px;
      background: rgba(139, 92, 246, 0.14);
      color: #ddd6fe;
      font-size: 0.9rem;
    }

    .fields {
      display: grid;
      gap: 15px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field label {
      font-weight: 800;
    }

    .field small {
      color: #9da9bf;
    }

    input {
      width: 100%;
      min-height: 48px;
      padding: 0 13px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 14px;
      outline: none;
      background: #202c41;
      color: white;
      user-select: text;
    }

    input:focus {
      border-color: #9b79ff;
      box-shadow: 0 0 0 3px rgba(155, 121, 255, 0.17);
    }

    .two-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .primary,
    .secondary {
      min-height: 51px;
      padding: 0 15px;
      border-radius: 16px;
      font-weight: 900;
    }

    .primary {
      border: 0;
      background: linear-gradient(145deg, #9b79ff, #6e4dd5);
      color: white;
    }

    .primary:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .secondary {
      border: 1px solid rgba(255, 255, 255, 0.13);
      background: #202c41;
      color: white;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 9px;
      margin-top: 19px;
    }

    .actions.single {
      grid-template-columns: 1fr;
    }

    .result-emoji {
      text-align: center;
      font-size: 65px;
    }

    .result-title {
      text-align: center;
    }

    .results {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 18px 0;
    }

    .result-item {
      padding: 11px 7px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.055);
      text-align: center;
    }

    .result-item small {
      display: block;
      color: #aeb9ce;
    }

    .result-item strong {
      display: block;
      margin-top: 3px;
    }

    #toast {
      position: absolute;
      z-index: 50;
      left: 50%;
      bottom: max(20px, env(safe-area-inset-bottom));
      transform: translate(-50%, 18px);
      padding: 10px 14px;
      border-radius: 999px;
      background: #151f32;
      border: 1px solid rgba(255, 255, 255, 0.13);
      opacity: 0;
      transition: 0.2s;
      pointer-events: none;
      white-space: nowrap;
    }

    #toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 600px) {
      .hud {
        right: 67px;
      }

      .toolbar {
        position: absolute;
        left: calc(100% + 8px);
        top: 0;
        flex-direction: column;
      }

      .two-columns {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main id="app">

    <canvas id="canvas"></canvas>

    <header id="hud" class="hud hidden">
      <div class="hud-box">
        <div id="targetPreview">🦊</div>

        <div class="hud-copy">
          <small>Trova l’unico bersaglio</small>
          <div id="gameStats">0,0 s · 0 errori</div>
        </div>
      </div>

      <div class="toolbar">
        <button id="zoomIn" class="icon-button">＋</button>
        <button id="zoomOut" class="icon-button">−</button>
        <button id="centerMap" class="icon-button">⌖</button>
        <button id="openSettings" class="icon-button">⚙</button>
      </div>
    </header>

    <section id="settingsOverlay" class="overlay">
      <div class="panel">
        <h1>Trova l’Emoji</h1>

        <p class="description">
          Emoji sparse casualmente, senza griglia. Un solo bersaglio.
        </p>

        <div id="unicodeStatus" class="status">
          Caricamento del catalogo Unicode completo…
        </div>

        <div class="fields">
          <div class="field">
            <label for="targetInput">Emoji da cercare</label>
            <input id="targetInput" value="🦊" maxlength="16">
            <small>
              Puoi incollare qualsiasi emoji presente nel catalogo Unicode.
            </small>
          </div>

          <div class="two-columns">
            <div class="field">
              <label for="totalInput">Emoji totali</label>
              <input
                id="totalInput"
                type="number"
                min="5"
                max="300"
                value="60"
              >
            </div>

            <div class="field">
              <label for="differentInput">Tipi diversi</label>
              <input
                id="differentInput"
                type="number"
                min="1"
                max="300"
                value="8"
              >
            </div>
          </div>

          <div class="field">
            <label for="distanceInput">Distanza minima</label>
            <input
              id="distanceInput"
              type="number"
              min="35"
              max="150"
              value="72"
            >
          </div>
        </div>

        <div class="actions single">
          <button id="startButton" class="primary" disabled>
            Caricamento emoji…
          </button>
        </div>
      </div>
    </section>

    <section id="resultOverlay" class="overlay hidden">
      <div class="panel">
        <div class="result-emoji">🎉</div>

        <h2 class="result-title">Trovata!</h2>

        <div class="results">
          <div class="result-item">
            <small>Tempo</small>
            <strong id="finalTime">0,0 s</strong>
          </div>

          <div class="result-item">
            <small>Errori</small>
            <strong id="finalErrors">0</strong>
          </div>

          <div class="result-item">
            <small>Punti</small>
            <strong id="finalScore">0</strong>
          </div>
        </div>

        <div class="actions">
          <button id="resultSettings" class="secondary">
            Impostazioni
          </button>

          <button id="playAgain" class="primary">
            Nuova mappa
          </button>
        </div>
      </div>
    </section>

    <div id="toast"></div>
  </main>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const hud = document.getElementById("hud");
    const settingsOverlay = document.getElementById("settingsOverlay");
    const resultOverlay = document.getElementById("resultOverlay");

    const targetPreview = document.getElementById("targetPreview");
    const gameStats = document.getElementById("gameStats");
    const unicodeStatus = document.getElementById("unicodeStatus");

    const targetInput = document.getElementById("targetInput");
    const totalInput = document.getElementById("totalInput");
    const differentInput = document.getElementById("differentInput");
    const distanceInput = document.getElementById("distanceInput");

    const startButton = document.getElementById("startButton");
    const toast = document.getElementById("toast");

    let EMOJI_POOL = [];

    const state = {
      width: 0,
      height: 0,
      dpr: 1,

      running: false,

      target: "🦊",
      total: 60,
      different: 8,
      minimumDistance: 72,

      objects: [],
      worldRadius: 650,

      cameraX: 0,
      cameraY: -50,
      zoom: 0.85,
      minZoom: 0.35,
      maxZoom: 2.2,

      startTime: 0,
      elapsed: 0,
      mistakes: 0,

      pointers: new Map(),
      gesture: null,
      moved: false,

      animationFrame: 0,
      tapMarker: null
    };

    function clamp(value, minimum, maximum) {
      return Math.max(minimum, Math.min(maximum, value));
    }

    function shuffle(array) {
      const result = [...array];

      for (let index = result.length - 1; index > 0; index--) {
        const randomIndex = Math.floor(Math.random() * (index + 1));

        [result[index], result[randomIndex]] = [
          result[randomIndex],
          result[index]
        ];
      }

      return result;
    }

    function firstGrapheme(value, fallback = "🦊") {
      const text = value.trim();

      if (!text) {
        return fallback;
      }

      if (window.Intl && Intl.Segmenter) {
        const segmenter = new Intl.Segmenter(undefined, {
          granularity: "grapheme"
        });

        const segments = [...segmenter.segment(text)];

        return segments[0]?.segment || fallback;
      }

      return [...text][0] || fallback;
    }

    async function loadOfficialUnicodeEmoji() {
      unicodeStatus.textContent =
        "Caricamento del catalogo ufficiale Unicode…";

      startButton.disabled = true;
      startButton.textContent = "Caricamento emoji…";

      try {
        const response = await fetch(
          "https://www.unicode.org/Public/emoji/latest/emoji-test.txt",
          {
            cache: "force-cache"
          }
        );

        if (!response.ok) {
          throw new Error(`Errore HTTP ${response.status}`);
        }

        const text = await response.text();

        const emojis = text
          .split(/\r?\n/)
          .filter(line => line.includes("; fully-qualified"))
          .map(line => {
            const commentIndex = line.indexOf("#");

            if (commentIndex === -1) {
              return null;
            }

            const comment = line
              .slice(commentIndex + 1)
              .trim();

            const match = comment.match(
              /^(\S+)\s+E\d+(?:\.\d+)?\s+/
            );

            return match ? match[1] : null;
          })
          .filter(Boolean);

        EMOJI_POOL = [...new Set(emojis)];

        if (EMOJI_POOL.length === 0) {
          throw new Error("Catalogo Unicode vuoto");
        }

        unicodeStatus.textContent =
          `${EMOJI_POOL.length.toLocaleString("it-IT")} emoji ufficiali caricati.`;

        startButton.disabled = false;
        startButton.textContent = "Genera mappa";
      } catch (error) {
        console.error(error);

        unicodeStatus.textContent =
          "Errore nel caricamento. Apri il file tramite un server web con Internet attivo.";

        startButton.disabled = true;
        startButton.textContent = "Catalogo non disponibile";
      }
    }

    function resizeCanvas() {
      state.width = window.innerWidth;
      state.height = window.innerHeight;
      state.dpr = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = Math.round(state.width * state.dpr);
      canvas.height = Math.round(state.height * state.dpr);

      canvas.style.width = `${state.width}px`;
      canvas.style.height = `${state.height}px`;

      ctx.setTransform(
        state.dpr,
        0,
        0,
        state.dpr,
        0,
        0
      );

      draw();
    }

    function worldToScreen(x, y) {
      return {
        x:
          state.width / 2 +
          state.cameraX +
          (x - y) * 0.72 * state.zoom,

        y:
          state.height / 2 +
          state.cameraY +
          (x + y) * 0.36 * state.zoom
      };
    }

    function createPositions(total, minimumDistance, radius) {
      const positions = [];

      let distance = minimumDistance;
      let attempts = 0;

      const maximumAttempts = total * 1500;

      while (
        positions.length < total &&
        attempts < maximumAttempts
      ) {
        attempts++;

        const x =
          (Math.random() * 2 - 1) *
          radius *
          0.88;

        const y =
          (Math.random() * 2 - 1) *
          radius *
          0.88;

        const valid = positions.every(position => {
          return Math.hypot(
            position.x - x,
            position.y - y
          ) >= distance;
        });

        if (valid) {
          positions.push({ x, y });
        }

        if (
          attempts > 0 &&
          attempts % Math.max(1000, total * 100) === 0
        ) {
          distance *= 0.92;
        }
      }

      while (positions.length < total) {
        positions.push({
          x: (Math.random() * 2 - 1) * radius * 0.88,
          y: (Math.random() * 2 - 1) * radius * 0.88
        });
      }

      return positions;
    }

    function generateObjects() {
      const available = EMOJI_POOL.filter(
        emoji => emoji !== state.target
      );

      const requestedDifferent = clamp(
        state.different,
        1,
        Math.min(
          available.length,
          Math.max(1, state.total - 1)
        )
      );

      const distractors = shuffle(available).slice(
        0,
        requestedDifferent
      );

      state.worldRadius = clamp(
        350 +
          Math.sqrt(state.total) *
          state.minimumDistance *
          0.7,
        500,
        1500
      );

      const positions = createPositions(
        state.total,
        state.minimumDistance,
        state.worldRadius
      );

      const targetIndex = Math.floor(
        Math.random() * state.total
      );

      state.objects = positions.map((position, index) => ({
        x: position.x,
        y: position.y,

        emoji:
          index === targetIndex
            ? state.target
            : distractors[
                Math.floor(Math.random() * distractors.length)
              ],

        isTarget: index === targetIndex,

        screenX: 0,
        screenY: 0,
        hitRadius: 28
      }));
    }

    function drawGround() {
      const radius = state.worldRadius;

      const corners = [
        worldToScreen(-radius, -radius),
        worldToScreen(radius, -radius),
        worldToScreen(radius, radius),
        worldToScreen(-radius, radius)
      ];

      ctx.save();

      ctx.beginPath();
      ctx.moveTo(corners[0].x, corners[0].y);

      for (let index = 1; index < corners.length; index++) {
        ctx.lineTo(corners[index].x, corners[index].y);
      }

      ctx.closePath();

      const gradient = ctx.createLinearGradient(
        state.width / 2,
        corners[0].y,
        state.width / 2,
        corners[2].y
      );

      gradient.addColorStop(0, "#598b69");
      gradient.addColorStop(0.55, "#47775a");
      gradient.addColorStop(1, "#315a45");

      ctx.fillStyle = gradient;
      ctx.fill();

      ctx.strokeStyle = "rgba(255,255,255,0.12)";
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.restore();
    }

    function drawGroundDepth() {
      const radius = state.worldRadius;

      const right = worldToScreen(radius, -radius);
      const bottom = worldToScreen(radius, radius);
      const left = worldToScreen(-radius, radius);

      const depth = 34 * state.zoom;

      ctx.save();

      ctx.beginPath();
      ctx.moveTo(left.x, left.y);
      ctx.lineTo(bottom.x, bottom.y);
      ctx.lineTo(bottom.x, bottom.y + depth);
      ctx.lineTo(left.x, left.y + depth);
      ctx.closePath();
      ctx.fillStyle = "#234836";
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(right.x, right.y);
      ctx.lineTo(bottom.x, bottom.y);
      ctx.lineTo(bottom.x, bottom.y + depth);
      ctx.lineTo(right.x, right.y + depth);
      ctx.closePath();
      ctx.fillStyle = "#193a2b";
      ctx.fill();

      ctx.restore();
    }

    function drawEmoji(object) {
      const point = worldToScreen(object.x, object.y);

      const fontSize = clamp(
        38 * state.zoom,
        21,
        68
      );

      object.screenX = point.x;
      object.screenY = point.y - fontSize * 0.48;
      object.hitRadius = Math.max(25, fontSize * 0.65);

      if (
        point.x < -100 ||
        point.x > state.width + 100 ||
        point.y < -120 ||
        point.y > state.height + 120
      ) {
        return;
      }

      ctx.save();

      ctx.beginPath();

      ctx.ellipse(
        point.x,
        point.y + 3,
        fontSize * 0.42,
        fontSize * 0.14,
        0,
        0,
        Math.PI * 2
      );

      ctx.fillStyle = "rgba(0,0,0,0.25)";
      ctx.fill();

      ctx.font =
        `${fontSize}px ` +
        `"Apple Color Emoji",` +
        `"Segoe UI Emoji",` +
        `"Noto Color Emoji",sans-serif`;

      ctx.textAlign = "center";
      ctx.textBaseline = "bottom";

      ctx.fillText(
        object.emoji,
        point.x,
        point.y
      );

      ctx.restore();
    }

    function drawTapMarker() {
      if (!state.tapMarker) {
        return;
      }

      const age =
        performance.now() -
        state.tapMarker.createdAt;

      if (age > 500) {
        state.tapMarker = null;
        return;
      }

      const progress = age / 500;
      const radius = 13 + progress * 20;

      ctx.save();

      ctx.beginPath();

      ctx.arc(
        state.tapMarker.x,
        state.tapMarker.y,
        radius,
        0,
        Math.PI * 2
      );

      ctx.strokeStyle = state.tapMarker.correct
        ? `rgba(74,222,128,${1 - progress})`
        : `rgba(251,113,133,${1 - progress})`;

      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.restore();
    }

    function draw() {
      ctx.clearRect(
        0,
        0,
        state.width,
        state.height
      );

      drawGroundDepth();
      drawGround();

      const sortedObjects = [...state.objects].sort(
        (first, second) =>
          first.x +
          first.y -
          (second.x + second.y)
      );

      sortedObjects.forEach(drawEmoji);

      drawTapMarker();
    }

    function resetCamera() {
      state.cameraX = 0;
      state.cameraY = window.innerWidth < 600 ? -40 : -80;
      state.zoom = window.innerWidth < 600 ? 0.72 : 0.88;

      draw();
    }

    function startGame() {
      if (EMOJI_POOL.length === 0) {
        showToast("Il catalogo Unicode non è ancora caricato");
        return;
      }

      state.target = firstGrapheme(
        targetInput.value,
        "🦊"
      );

      state.total = clamp(
        Number(totalInput.value) || 60,
        5,
        300
      );

      state.different = clamp(
        Number(differentInput.value) || 8,
        1,
        Math.min(300, state.total - 1)
      );

      state.minimumDistance = clamp(
        Number(distanceInput.value) || 72,
        35,
        150
      );

      targetInput.value = state.target;
      totalInput.value = state.total;
      differentInput.value = state.different;
      distanceInput.value = state.minimumDistance;

      state.mistakes = 0;
      state.elapsed = 0;
      state.running = true;
      state.tapMarker = null;

      targetPreview.textContent = state.target;
      gameStats.textContent = "0,0 s · 0 errori";

      generateObjects();
      resetCamera();

      settingsOverlay.classList.add("hidden");
      resultOverlay.classList.add("hidden");
      hud.classList.remove("hidden");

      state.startTime = performance.now();

      cancelAnimationFrame(state.animationFrame);
      gameLoop();
    }

    function gameLoop() {
      if (state.running) {
        state.elapsed =
          performance.now() -
          state.startTime +
          state.mistakes * 1200;

        gameStats.textContent =
          `${(state.elapsed / 1000)
            .toFixed(1)
            .replace(".", ",")} s · ` +
          `${state.mistakes} errori`;
      }

      draw();

      state.animationFrame =
        requestAnimationFrame(gameLoop);
    }

    function checkTap(x, y) {
      if (!state.running) {
        return;
      }

      let nearest = null;
      let nearestDistance = Infinity;

      for (const object of state.objects) {
        const distance = Math.hypot(
          object.screenX - x,
          object.screenY - y
        );

        if (distance < nearestDistance) {
          nearestDistance = distance;
          nearest = object;
        }
      }

      const correct =
        nearest &&
        nearest.isTarget &&
        nearestDistance <= nearest.hitRadius;

      state.tapMarker = {
        x,
        y,
        correct,
        createdAt: performance.now()
      };

      if (correct) {
        finishGame();
        return;
      }

      state.mistakes++;

      showToast("Punto sbagliato: +1,2 secondi");

      if (navigator.vibrate) {
        navigator.vibrate(25);
      }
    }

    function finishGame() {
      state.running = false;

      const score = Math.max(
        100,
        Math.round(
          state.total * 45 +
          state.different * 130 -
          state.elapsed * 0.18 -
          state.mistakes * 190
        )
      );

      document.getElementById("finalTime").textContent =
        `${(state.elapsed / 1000)
          .toFixed(1)
          .replace(".", ",")} s`;

      document.getElementById("finalErrors").textContent =
        state.mistakes;

      document.getElementById("finalScore").textContent =
        score.toLocaleString("it-IT");

      if (navigator.vibrate) {
        navigator.vibrate([40, 30, 100]);
      }

      setTimeout(() => {
        resultOverlay.classList.remove("hidden");
      }, 300);
    }

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add("show");

      clearTimeout(showToast.timer);

      showToast.timer = setTimeout(() => {
        toast.classList.remove("show");
      }, 1000);
    }

    function openSettingsPanel() {
      state.running = false;

      hud.classList.add("hidden");
      resultOverlay.classList.add("hidden");
      settingsOverlay.classList.remove("hidden");
    }

    function changeZoom(amount) {
      state.zoom = clamp(
        state.zoom + amount,
        state.minZoom,
        state.maxZoom
      );

      draw();
    }

    function pointerDistance(points) {
      return Math.hypot(
        points[1].x - points[0].x,
        points[1].y - points[0].y
      );
    }

    function pointerCenter(points) {
      return {
        x: (points[0].x + points[1].x) / 2,
        y: (points[0].y + points[1].y) / 2
      };
    }

    canvas.addEventListener("pointerdown", event => {
      canvas.setPointerCapture(event.pointerId);

      state.pointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
      });

      state.moved = false;

      const points = [...state.pointers.values()];

      if (points.length === 1) {
        state.gesture = {
          type: "drag",
          x: points[0].x,
          y: points[0].y,
          cameraX: state.cameraX,
          cameraY: state.cameraY
        };
      }

      if (points.length === 2) {
        state.gesture = {
          type: "pinch",
          distance: pointerDistance(points),
          center: pointerCenter(points),
          zoom: state.zoom,
          cameraX: state.cameraX,
          cameraY: state.cameraY
        };
      }
    });

    canvas.addEventListener("pointermove", event => {
      if (!state.pointers.has(event.pointerId)) {
        return;
      }

      state.pointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
      });

      const points = [...state.pointers.values()];

      if (
        points.length === 1 &&
        state.gesture?.type === "drag"
      ) {
        const deltaX = points[0].x - state.gesture.x;
        const deltaY = points[0].y - state.gesture.y;

        if (Math.hypot(deltaX, deltaY) > 6) {
          state.moved = true;
        }

        state.cameraX =
          state.gesture.cameraX + deltaX;

        state.cameraY =
          state.gesture.cameraY + deltaY;
      }

      if (
        points.length === 2 &&
        state.gesture?.type === "pinch"
      ) {
        const distance = pointerDistance(points);
        const center = pointerCenter(points);

        if (
          Math.abs(distance - state.gesture.distance) > 5
        ) {
          state.moved = true;
        }

        state.zoom = clamp(
          state.gesture.zoom *
            (distance / Math.max(1, state.gesture.distance)),
          state.minZoom,
          state.maxZoom
        );

        state.cameraX =
          state.gesture.cameraX +
          center.x -
          state.gesture.center.x;

        state.cameraY =
          state.gesture.cameraY +
          center.y -
          state.gesture.center.y;
      }

      draw();
    });

    function endPointer(event) {
      const pointerCount = state.pointers.size;
      const tapX = event.clientX;
      const tapY = event.clientY;

      state.pointers.delete(event.pointerId);

      if (pointerCount === 1 && !state.moved) {
        checkTap(tapX, tapY);
      }

      const remaining = [...state.pointers.values()];

      if (remaining.length === 0) {
        state.gesture = null;
      } else if (remaining.length === 1) {
        state.gesture = {
          type: "drag",
          x: remaining[0].x,
          y: remaining[0].y,
          cameraX: state.cameraX,
          cameraY: state.cameraY
        };
      }
    }

    canvas.addEventListener("pointerup", endPointer);
    canvas.addEventListener("pointercancel", endPointer);

    canvas.addEventListener(
      "wheel",
      event => {
        event.preventDefault();

        changeZoom(
          event.deltaY > 0 ? -0.08 : 0.08
        );
      },
      {
        passive: false
      }
    );

    startButton.addEventListener("click", startGame);

    document
      .getElementById("playAgain")
      .addEventListener("click", startGame);

    document
      .getElementById("openSettings")
      .addEventListener("click", openSettingsPanel);

    document
      .getElementById("resultSettings")
      .addEventListener("click", openSettingsPanel);

    document
      .getElementById("centerMap")
      .addEventListener("click", resetCamera);

    document
      .getElementById("zoomIn")
      .addEventListener("click", () => changeZoom(0.12));

    document
      .getElementById("zoomOut")
      .addEventListener("click", () => changeZoom(-0.12));

    window.addEventListener("resize", resizeCanvas);

    resizeCanvas();
    loadOfficialUnicodeEmoji();
  </script>
</body>
</html>
