<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Il mio primo sito</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5f9;
      color: #172033;
    }

    main {
      width: 90%;
      max-width: 700px;
      margin: 80px auto;
      padding: 40px;
      box-sizing: border-box;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
      text-align: center;
    }

    h1 {
      color: #0969da;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 20px;
      background: #0969da;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <main>
    <h1>Benvenuto nel mio sito!</h1>

    <p>
      Questa è la mia prima pagina pubblicata gratuitamente con GitHub Pages.
    </p>

    <a href="mailto:tuoindirizzo@example.com">Scrivimi</a>
  </main>
</body>
</html>
