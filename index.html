<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tunnel delle formiche</title>

  <style>
    :root {
      --terra: #2d1c12;
      --terra-chiara: #5c3a22;
      --galleria: #d6ad72;
      --bordo: #9b6d3c;
      --testo: #fff8e8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--terra);
      color: var(--testo);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      overflow-x: hidden;
      cursor: none;
      background:
        radial-gradient(circle at 20% 15%, rgba(255,255,255,.05), transparent 22%),
        radial-gradient(circle at 80% 75%, rgba(255,255,255,.04), transparent 24%),
        var(--terra);
    }

    .pagina {
      position: relative;
      min-height: 100vh;
      padding: 28px 18px 60px;
      overflow: hidden;
    }

    .titolo {
      position: relative;
      z-index: 5;
      max-width: 760px;
      margin: 0 auto 26px;
      text-align: center;
    }

    .titolo h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 6vw, 4rem);
      line-height: .95;
    }

    .titolo p {
      margin: 0;
      opacity: .82;
    }

    .mappa {
      position: relative;
      width: min(1100px, 100%);
      min-height: 780px;
      margin: 0 auto;
    }

    .tunnel-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 12px 10px rgba(0,0,0,.22));
    }

    .tunnel-bordo,
    .tunnel {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tunnel-bordo {
      stroke: var(--bordo);
      stroke-width: 88;
    }

    .tunnel {
      stroke: var(--galleria);
      stroke-width: 66;
    }

    .camera {
      position: absolute;
      z-index: 4;
      left: 50%;
      top: 425px;
      width: min(680px, calc(100% - 28px));
      transform: translateX(-50%);
      padding: 26px;
      border: 10px solid var(--bordo);
      border-radius: 42% 58% 46% 54% / 42% 45% 55% 58%;
      background: var(--galleria);
      color: #25170f;
      box-shadow: 0 18px 35px rgba(0,0,0,.28);
      cursor: auto;
    }

    .camera h2 {
      margin: 0 0 14px;
      text-align: center;
      font-size: clamp(1.35rem, 4vw, 2.1rem);
    }

    .form-box {
      padding: 14px;
      border-radius: 24px;
      background: rgba(255,255,255,.72);
    }

    .form-box,
    .form-box * {
      cursor: auto;
    }

    .ingresso {
      position: absolute;
      z-index: 3;
      left: 44px;
      top: 95px;
      width: 110px;
      height: 70px;
      display: grid;
      place-items: center;
      border: 8px solid var(--bordo);
      border-radius: 50%;
      background: var(--galleria);
      color: #25170f;
      font-weight: 800;
      transform: rotate(-8deg);
    }

    .formica {
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 24px;
      height: 40px;
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: opacity .15s ease;
    }

    .formica::before,
    .formica::after,
    .formica span {
      content: "";
      position: absolute;
      left: 50%;
      width: 13px;
      height: 13px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: #17100b;
      box-shadow: 0 0 0 2px rgba(255,255,255,.08);
    }

    .formica::before {
      top: 0;
      width: 11px;
      height: 11px;
    }

    .formica span {
      top: 12px;
    }

    .formica::after {
      top: 25px;
      width: 16px;
      height: 15px;
    }

    .zampa {
      position: absolute;
      left: 50%;
      top: 17px;
      width: 34px;
      height: 2px;
      background: #17100b;
      transform: translateX(-50%) rotate(var(--r));
      transform-origin: center;
    }

    .zampa.a { --r: 24deg; }
    .zampa.b { --r: -24deg; }
    .zampa.c { --r: 0deg; }

    .istruzione {
      position: absolute;
      z-index: 3;
      right: 22px;
      top: 114px;
      max-width: 250px;
      padding: 12px 15px;
      border: 2px solid rgba(255,255,255,.15);
      border-radius: 16px;
      background: rgba(0,0,0,.18);
      font-size: .92rem;
      line-height: 1.35;
    }

    @media (max-width: 720px) {
      .mappa {
        min-height: 900px;
      }

      .camera {
        top: 500px;
        padding: 18px;
      }

      .istruzione {
        top: 185px;
        right: 10px;
        max-width: 180px;
        font-size: .78rem;
      }

      .ingresso {
        left: 12px;
      }

      .tunnel-bordo {
        stroke-width: 72;
      }

      .tunnel {
        stroke-width: 52;
      }
    }

    @media (pointer: coarse) {
      body {
        cursor: auto;
      }

      .formica {
        display: none;
      }
    }
  </style>
</head>

<body>
  <main class="pagina">
    <header class="titolo">
      <h1>Il tunnel delle formiche</h1>
      <p>Segui le gallerie fino alla camera del form.</p>
    </header>

    <section class="mappa" id="mappa">
      <div class="ingresso">ENTRA</div>

      <div class="istruzione">
        La formica visibile segue soltanto il centro delle gallerie.
      </div>

      <svg
        class="tunnel-svg"
        viewBox="0 0 1100 780"
        preserveAspectRatio="none"
        aria-hidden="true"
      >
        <path
          class="tunnel-bordo"
          d="M95 125
             C210 105 225 250 345 225
             C470 200 420 80 565 120
             C720 165 610 330 760 310
             C875 294 915 195 1010 230
             C1065 250 1020 365 910 385
             C775 410 710 420 650 500"
        />
        <path
          class="tunnel"
          id="percorso"
          d="M95 125
             C210 105 225 250 345 225
             C470 200 420 80 565 120
             C720 165 610 330 760 310
             C875 294 915 195 1010 230
             C1065 250 1020 365 910 385
             C775 410 710 420 650 500"
        />

        <path
          class="tunnel-bordo"
          d="M345 225 C300 330 180 320 170 430"
        />
        <path
          class="tunnel"
          id="ramo1"
          d="M345 225 C300 330 180 320 170 430"
        />

        <path
          class="tunnel-bordo"
          d="M760 310 C825 465 980 470 990 590"
        />
        <path
          class="tunnel"
          id="ramo2"
          d="M760 310 C825 465 980 470 990 590"
        />
      </svg>

      <section class="camera" id="camera">
        <h2>Invia una foto a Snail Garden</h2>

        <div class="form-box">
          <iframe data-tally-src="https://tally.so/embed/EkeqWA?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1" loading="lazy" width="100%" height="283" frameborder="0" marginheight="0" marginwidth="0" title="Invia una foto a Snail Garden"></iframe>
          <script>var d=document,w="https://tally.so/widgets/embed.js",v=function(){"undefined"!=typeof Tally?Tally.loadEmbeds():d.querySelectorAll("iframe[data-tally-src]:not([src])").forEach((function(e){e.src=e.dataset.tallySrc}))};if("undefined"!=typeof Tally)v();else if(d.querySelector('script[src="'+w+'"]')==null){var s=d.createElement("script");s.src=w,s.onload=v,s.onerror=v,d.body.appendChild(s);}</script>
        </div>
      </section>
    </section>
  </main>

  <div class="formica" id="formica" aria-hidden="true">
    <i class="zampa a"></i>
    <i class="zampa b"></i>
    <i class="zampa c"></i>
    <span></span>
  </div>

  <script>
    const formica = document.getElementById("formica");
    const camera = document.getElementById("camera");
    const paths = [
      document.getElementById("percorso"),
      document.getElementById("ramo1"),
      document.getElementById("ramo2")
    ];

    let samples = [];
    let last = null;

    function rebuildSamples() {
      samples = [];

      paths.forEach(path => {
        const total = path.getTotalLength();
        const svg = path.ownerSVGElement;
        const matrix = svg.getScreenCTM();

        for (let length = 0; length <= total; length += 5) {
          const point = path.getPointAtLength(length);
          const screenPoint = new DOMPoint(point.x, point.y).matrixTransform(matrix);

          samples.push({
            x: screenPoint.x,
            y: screenPoint.y
          });
        }
      });

      if (!last && samples.length) {
        last = samples[0];
        moveAnt(last.x, last.y);
      }
    }

    function nearestPoint(x, y) {
      let best = null;
      let bestDistance = Infinity;

      for (const point of samples) {
        const dx = point.x - x;
        const dy = point.y - y;
        const distance = dx * dx + dy * dy;

        if (distance < bestDistance) {
          bestDistance = distance;
          best = point;
        }
      }

      return {
        point: best,
        distance: Math.sqrt(bestDistance)
      };
    }

    function moveAnt(x, y) {
      if (!last) {
        last = { x, y };
      }

      const angle = Math.atan2(y - last.y, x - last.x) * 180 / Math.PI + 90;

      formica.style.transform =
        `translate(${x}px, ${y}px) translate(-50%, -50%) rotate(${angle}deg)`;

      last = { x, y };
    }

    function isInsideCamera(x, y) {
      const rect = camera.getBoundingClientRect();

      return (
        x >= rect.left &&
        x <= rect.right &&
        y >= rect.top &&
        y <= rect.bottom
      );
    }

    window.addEventListener("mousemove", event => {
      if (isInsideCamera(event.clientX, event.clientY)) {
        formica.style.opacity = "0";
        return;
      }

      formica.style.opacity = "1";

      const nearest = nearestPoint(event.clientX, event.clientY);

      if (nearest.point && nearest.distance <= 90) {
        moveAnt(nearest.point.x, nearest.point.y);
      }
    });

    window.addEventListener("resize", rebuildSamples);
    window.addEventListener("scroll", rebuildSamples, { passive: true });
    window.addEventListener("load", rebuildSamples);

    rebuildSamples();
  </script>
</body>
</html>
